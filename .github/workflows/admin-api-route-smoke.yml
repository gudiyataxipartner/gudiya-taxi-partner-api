name: Verify Admin API Routes

on:
  push:
    branches: [main]
    paths:
      - "src/server.js"
      - ".github/workflows/admin-api-route-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-admin-routes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout API repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Locate backend JavaScript parse errors
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts acorn@8
          node - <<'JS'
          const fs = require('fs');
          const acorn = require('acorn');
          const source = fs.readFileSync('src/server.js', 'utf8');
          try {
            const ast = acorn.parse(source, { ecmaVersion: 'latest', sourceType: 'script', locations: true });
            function inspect(node, parents=[]) {
              if (node.type === 'FunctionDeclaration' && node.id && node.id.name === 'initializeDatabase') {
                const scope = parents.filter(p => /Function|ArrowFunction/.test(p.type)).map(p => ({
                  type:p.type, name:p.id && p.id.name || p.key && p.key.name || '(anonymous)',
                  line:p.loc && p.loc.start.line
                }));
                console.log('initializeDatabase scope ancestry:', JSON.stringify(scope));
                console.log('initializeDatabase declaration line:', node.loc.start.line);
              }
              for (const [key,value] of Object.entries(node)) {
                if (key === 'loc' || key === 'start' || key === 'end') continue;
                if (Array.isArray(value)) for (const child of value) if (child && typeof child.type === 'string') inspect(child,[...parents,node]);
                else if (value && typeof value.type === 'string') inspect(value,[...parents,node]);
              }
            }
            inspect(ast);
            console.log('Acorn parse passed.');
          } catch (error) {
            console.error('Backend parse error:', error.message, error.loc || '');
            for (const suffix of ['}', '}}', '}}}', ')', ']', '});', '\\n}\\n']) {
              try {
                acorn.parse(source + suffix, { ecmaVersion: 'latest', sourceType: 'script' });
                console.error('Appended suffix parses successfully:', JSON.stringify(suffix));
                break;
              } catch (_) {}
            }
            const tokenizer = acorn.tokenizer(source, { ecmaVersion: 'latest', sourceType: 'script', locations: true });
            const stack = [];
            const close = { '}':'{', ')':'(', ']':'[' };
            while (true) {
              const token = tokenizer.getToken();
              const label = token.type.label;
              if (label === 'eof') break;
              if (label === '{' || label === '(' || label === '[') stack.push({label,line:token.loc.start.line,column:token.loc.start.column});
              else if (label === '}' || label === ')' || label === ']') {
                const expected = close[label];
                if (stack.length && stack[stack.length-1].label === expected) stack.pop();
              }
            }
            console.error('Unclosed delimiter stack:', JSON.stringify(stack.slice(-30)));
            process.exit(1);
          }
          JS
      - name: Validate backend JavaScript syntax
        run: node --check src/server.js

      - name: Wait for Render and verify protected Admin routes
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://gudiya-taxi-partner-api-1.onrender.com"
          ROUTES=(
            "/api/admin/activity"
            "/api/admin/security/sessions"
            "/api/admin/backup/export"
            "/api/admin/export/users.csv"
            "/api/admin/export/duties.csv"
            "/api/admin/export/referrals.csv"
            "/api/admin/export/activity.csv"
            "/api/vehicles/available"
            "/api/vehicles/available/mine"
          )

          for attempt in $(seq 1 60); do
            all_ready=true
            for route in "${ROUTES[@]}"; do
              status="$(curl --silent --show-error --max-time 12 -o /tmp/admin-route-response.txt -w '%{http_code}' "$BASE$route" || true)"
              if [[ "$status" != "401" && "$status" != "403" ]]; then
                echo "Waiting for route $route; unauthenticated HTTP status: ${status:-000}"
                all_ready=false
                break
              fi
            done
            if [[ "$all_ready" == "true" ]]; then
              echo "All protected Admin routes are registered and reject unauthenticated requests."
              exit 0
            fi
            sleep 10
          done

          echo "Admin route smoke test failed: one or more routes still return 404 or another unexpected status."
          exit 1
